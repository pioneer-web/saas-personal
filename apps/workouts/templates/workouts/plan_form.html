{% extends "base.html" %}

{% block content %}

<div class="mx-auto max-w-3xl">

<h1 class="mb-6 text-3xl font-black">
    {{ title }}
</h1>

<form method="post"
      class="space-y-5 rounded-[28px]
             border border-white/10
             bg-[#1a1715] p-5 sm:p-8">

{% csrf_token %}

{% for field in form %}

<div>

<label class="mb-2 block text-sm font-bold">
    {{ field.label }}
</label>

{{ field }}

{% for error in field.errors %}
<p class="mt-1 text-sm text-red-400">
    {{ error }}
</p>
{% endfor %}

</div>

{% endfor %}

<button class="min-h-12 w-full rounded-2xl
               bg-gradient-to-r
               from-[#ce3221] to-[#ed5d26]
               font-bold">
    Salvar e montar treino
</button>

</form>

</div>

<style>
input, select, textarea {
    width:100%;
    min-height:48px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    padding:12px 15px;
    background:#0c0c09;
    color:white;
}
</style>

{% endblock %}
