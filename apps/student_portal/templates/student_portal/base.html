<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ed5d26">
<link rel="manifest" href="{% url 'student_portal:manifest' %}">
<title>{% block title %}Personal{% endblock %}</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
html,body{background:#0c0c09;color:#fff}
body{padding-bottom:80px}
input,select,textarea{width:100%;min-height:48px;border:1px solid #ffffff1a;border-radius:16px;padding:12px 14px;background:#151310;color:#fff}
</style>
</head>
<body>
<header class="sticky top-0 z-40 border-b border-white/5 bg-[#0c0c09]/90 backdrop-blur">
<div class="mx-auto flex max-w-xl items-center justify-between px-4 py-4">
<b>PERSONAL<span class="text-[#ed5d26]">.</span></b>
{% if request.user.is_authenticated %}
<a href="{% url 'student_portal:notifications' %}">🔔</a>
{% endif %}
</div>
</header>

<main class="mx-auto max-w-xl p-4">
{% block content %}{% endblock %}
</main>

{% if request.user.is_authenticated %}
<nav class="fixed bottom-0 left-0 right-0 z-50 border-t border-white/5 bg-[#100e0c]/95">
<div class="mx-auto grid max-w-xl grid-cols-4 p-2 text-center text-xs">
<a href="{% url 'student_portal:home' %}" class="p-2">⌂<br>Início</a>
<a href="{% url 'student_portal:history' %}" class="p-2">◷<br>Histórico</a>
<a href="{% url 'student_portal:progress' %}" class="p-2">↗<br>Evolução</a>
<a href="{% url 'student_portal:profile' %}" class="p-2">◎<br>Perfil</a>
</div>
</nav>
{% endif %}

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("{% url 'student_portal:sw' %}");
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
